  const out = new Map();
  G.edges.forEach(e => {
    if (e.source === id) { const k = "→" + e.type; (out.get(k) || out.set(k, []).get(k)).push([e.target, e]); }
    if (e.target === id) { const k = "←" + e.type; (out.get(k) || out.set(k, []).get(k)).push([e.source, e]); }
  });
  return out;
}
function highlight(id) {
  const keep = new Set([id]);
  G.edges.forEach(e => { if (e.source === id) keep.add(e.target); if (e.target === id) keep.add(e.source); });
  const dim = css("--dim");
  nodes.update(G.nodes.map(n => keep.has(n.id) ? { id: n.id, color: nodeStyle(n).color, font: nodeStyle(n).font, label: n.label }
    : { id: n.id, color: { background: dim, border: dim }, font: { color: "rgba(0,0,0,0)", strokeWidth: 0 } }));
}
function clearHighlight() { selected = null; nodes.update(G.nodes.map(nodeStyle)); renderEmpty(); }
function focusNode(id) {
  const n = byId.get(id); if (!n) return;
  if (!visible.has(n.type)) { visible.add(n.type); typesEl.querySelector(`[data-t="${n.type}"]`)?.setAttribute("aria-pressed", true); applyFilter(); }
  selected = id; highlight(id); renderNode(n);
  net.selectNodes([id]); net.focus(id, { scale: 1.1, animation: { duration: 450 } });
}
net.on("click", p => p.nodes.length ? focusNode(p.nodes[0]) : clearHighlight());
document.getElementById("q").addEventListener("change", e => {
  const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const n = G.nodes.find(n => n.label.toLowerCase() === v) || G.nodes.find(n => n.label.toLowerCase().includes(v));
  if (n) focusNode(n.id);
});

const insp = document.getElementById("inspector");
const PROP_ORDER = ["title", "kind", "status", "category", "role", "ecosystem", "commits", "files", "first_commit", "last_commit", "used_by_projects", "technology", "url"];
const PROP_LABEL = { title: "Title", kind: "Kind", status: "Status", category: "Category", role: "Role", ecosystem: "Ecosystem", commits: "Commits",
  files: "Files", first_commit: "First commit", last_commit: "Last commit", used_by_projects: "Used by", technology: "Technology", url: "Repo" };
function renderNode(n) {
  const key = (TYPES.find(t => t[0] === n.type) || [, "library"])[1];
  let h = `<span class="kind"><i style="background:var(--c-${key})"></i>${esc(n.type)}</span><h2>${esc(n.label)}</h2>`;
  if (n.props.description) h += `<p class="desc">${esc(n.props.description)}</p>`;
  h += "<dl>";
  PROP_ORDER.forEach(k => { const v = n.props[k]; if (v === undefined || v === "" || (k === "title" && v === n.label)) return;
    let val = esc(Array.isArray(v) ? v.join(", ") : v);
    if (k === "url") val = `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace("https://github.com/", ""))}</a>`;
    if (k === "used_by_projects") val += " projects";
    h += `<dt>${PROP_LABEL[k]}</dt><dd>${val}</dd>`; });
  if (n.type === "Project" && PAGES_BASE && !single) h += `<dt>Graph</dt><dd><a href="${PAGES_BASE}${encodeURIComponent(n.label)}/index.html">Open project graph</a></dd>`;
  h += "</dl>";
  const groups = [...neighbours(n.id)].sort((a, b) => b[1].length - a[1].length);
  groups.forEach(([k, list]) => {
    const dir = k[0], type = k.slice(1);
    const label = dir === "→" ? (REL_LABEL[type] || type) : (INV_LABEL[type] || type);
    list.sort((a, b) => (degree.get(b[0]) || 0) - (degree.get(a[0]) || 0));
    h += `<div class="rel"><h3><span>${esc(label)}</span><span>${list.length}</span></h3><div class="chips">` +
      list.map(([id, e]) => { const m = byId.get(id); if (!m) return "";
        const mk = (TYPES.find(t => t[0] === m.type) || [, "library"])[1];
        let extra = e.props?.identical_files ? ` · ${e.props.identical_files} files` : e.props?.score ? ` · ${Math.round(e.props.score * 100)}%` : e.props?.commits ? ` · ${e.props.commits}` : "";
        const tip = e.props?.shared ? "Shared: " + e.props.shared.join(", ") : e.props?.examples ? "e.g. " + e.props.examples.join(", ") : "";
        return `<button class="chip" type="button" data-id="${esc(id)}" title="${esc(tip)}"><i style="background:var(--c-${mk})"></i><span>${esc(m.label)}${extra}</span></button>`; }).join("") +
      `</div></div>`;
  });
  insp.innerHTML = h;
  insp.querySelectorAll(".chip").forEach(b => b.onclick = () => focusNode(b.dataset.id));
  insp.scrollTop = 0;
}
function renderEmpty() {
  const reuse = G.edges.filter(e => e.type === "SHARES_CODE_WITH" || e.type === "EVOLVED_INTO");
  const topTech = G.nodes.filter(n => n.type === "Technology").map(n => [n, G.edges.filter(e => e.target === n.id && e.type === "USES" && e.source.startsWith("project:")).length])
    .sort((a, b) => b[1] - a[1]).slice(0, 10);
  let h = `<p class="label">Overview</p><div class="empty"><p>Select any node to see what it connects to. Projects link to their stack, the services they call, what they are about and who built them.</p></div>`;
  if (single) { const p = projects[0]; renderNode(p); selected = null; return; }
  h += `<div class="rel"><h3><span>Most used technologies</span><span>projects</span></h3><div class="chips">` +
    topTech.map(([n, c]) => `<button class="chip" type="button" data-id="${esc(n.id)}"><i style="background:var(--c-tech)"></i><span>${esc(n.label)} · ${c}</span></button>`).join("") + `</div></div>`;
  if (reuse.length) h += `<div class="rel"><h3><span>Code reuse</span><span>${reuse.length}</span></h3><div class="chips">` +
    reuse.map(e => `<button class="chip" type="button" data-id="${esc(e.source)}"><i style="background:var(--c-project)"></i><span>${esc(byId.get(e.source).label)} → ${esc(byId.get(e.target).label)}</span></button>`).join("") + `</div></div>`;
  insp.innerHTML = h;
  insp.querySelectorAll(".chip").forEach(b => b.onclick = () => focusNode(b.dataset.id));
}
renderEmpty();
</script>
