:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accent: #2dd4bf; --accent-ink: #062b27; --dim: rgba(228,236,234,.10);

:root[data-theme="dark"] {
  --bg: #0f1514; --panel: #161e1c; --ink: #e4ecea; --muted: #93a39f; --line: #2a3634;
  --accent: #2dd4bf; --accent-ink: #062b27; --dim: rgba(228,236,234,.10);
  --c-project: #2dd4bf; --c-component: #8fb3c9; --c-tech: #fb923c; --c-library: #6b7a76;
  --c-language: #a78bfa; --c-service: #f472b6; --c-platform: #a3e635; --c-concept: #fbbf24; --c-person: #60a5fa;

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); margin: 0 }

header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;

.sub { color: var(--muted); font-size: 14px; min-width: 0 }

aside, .inspector { background: var(--panel); overflow: auto; padding: 14px 16px; min-width: 0 }

.types { display: flex; flex-direction: column; gap: 2px }

.type:hover { background: var(--dim) }

.type .n { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.type[aria-pressed="false"] { color: var(--muted) }
.type[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted) }
.plist { display: flex; flex-direction: column; gap: 1px; margin: 0; padding: 0; list-style: none }

.plist button:hover { background: var(--dim) }

.status { font: 11px var(--f-mono); padding: 1px 6px; border-radius: 99px; flex: none }
.status.active { background: color-mix(in srgb, var(--c-platform) 22%, transparent); color: var(--ink) }
.status.recent { background: color-mix(in srgb, var(--c-concept) 22%, transparent); color: var(--ink) }
.status.dormant { background: var(--dim); color: var(--muted) }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.btn { font: 13px var(--f-body); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer }
.btn:hover { border-color: var(--accent) }
#graph { position: relative; min-width: 0; min-height: 0; background: var(--bg) }
#net { position: absolute; inset: 0 }
.hint { position: absolute; left: 12px; bottom: 10px; font: 12px var(--f-mono); color: var(--muted); pointer-events: none }
.inspector h2 { font: 700 20px/1.2 var(--f-display); margin: 4px 0 6px; overflow-wrap: anywhere; text-wrap: balance }
.kind { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.kind i { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
.desc { margin: 8px 0 14px; max-width: 60ch }
dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; margin: 0 0 16px; font-size: 13px }
dt { color: var(--muted); font: 12px var(--f-mono) }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums }
dd a { color: var(--accent) }
.rel { margin: 0 0 14px }
.rel h3 { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between }
.chips { display: flex; flex-wrap: wrap; gap: 5px }
.chip { font: 13px var(--f-body); padding: 2px 8px 2px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);

.chip i { width: 8px; height: 8px; border-radius: 50%; flex: none }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip:hover { border-color: var(--accent) }
.empty { color: var(--muted); font-size: 14px }
.empty p { margin: 0 0 10px; max-width: 40ch }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 62vh auto; height: auto }
  html, body { height: auto }

  .stats { margin-left: 0 }

@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="app">
  <header>
    <h1>HR-tracker</h1>
    <span class="sub">Haryana Bus Tracker, a real-time bus tracking app for Haryana Roadways with route search, </span>
    <div class="stats" id="stats"></div>

  <aside>

  <main id="graph"><div id="net"></div><div class="hint">Click a node · scroll to zoom · drag to move</div></main>
  <section class="inspector" id="inspector" aria-live="polite"></section>
</div>

}
function edgeStyle(e, i) {
  const cross = ["SIMILAR_STACK", "SHARES_CODE_WITH", "EVOLVED_INTO", "STARTED_FROM_TEMPLATE_OF", "RELATED_TO"].includes(e.type);
  const strong = e.type === "SHARES_CODE_WITH" || e.type === "EVOLVED_INTO";
  return { id: "e" + i, from: e.source, to: e.target, title: REL_LABEL[e.type] || e.type,
    arrows: cross && e.type !== "SIMILAR_STACK" ? { to: { enabled: true, scaleFactor: .5 } } : undefined,
    dashes: e.type === "SIMILAR_STACK", width: strong ? 3 : cross ? 1.6 : .7,
    color: { color: cross ? css("--accent") : css("--line"), highlight: css("--ink"), hover: css("--muted"), opacity: cross ? .9 : .8 },
    smooth: false, hidden: !(visible.has(byId.get(e.source)?.type) && visible.has(byId.get(e.target)?.type)) };
}
const nodes = new vis.DataSet(G.nodes.map(nodeStyle));
const edges = new vis.DataSet(G.edges.map(edgeStyle));
const net = new vis.Network(document.getElementById("net"), { nodes, edges }, {
  physics: { solver: "forceAtlas2Based", forceAtlas2Based: { gravitationalConstant: -60, springLength: 90, avoidOverlap: .4 },
    stabilization: { iterations: 260 } },
  interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: true }, layout: { improvedLayout: G.nodes.length < 150 } });
net.once("stabilizationIterationsDone", () => net.fit({ animation: false }));

function applyFilter() {
  nodes.update(G.nodes.map(n => ({ id: n.id, hidden: !visible.has(n.type) })));
  edges.update(G.edges.map((e, i) => ({ id: "e" + i, hidden: !(visible.has(byId.get(e.source)?.type) && visible.has(byId.get(e.target)?.type)) })));
}
function restyle() { nodes.update(G.nodes.map(nodeStyle)); edges.update(G.edges.map(edgeStyle)); if (selected) highlight(selected); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

let frozen = false;
document.getElementById("freeze").onclick = e => { frozen = !frozen; net.setOptions({ physics: { enabled: !frozen } }); e.target.textContent = frozen ? "Resume layout" : "Pause layout"; };
document.getElementById("fit").onclick = () => net.fit({ animation: { duration: 400 } });

// ---------- selection
let selected = null;
function neighbours(id) {
  const out = new Map();
  G.edges.forEach(e => {
    if (e.source === id) { const k = "→" + e.type; (out.get(k) || out.set(k, []).get(k)).push([e.target, e]); }
    if (e.target === id) { const k = "←" + e.type; (out.get(k) || out.set(k, []).get(k)).push([e.source, e]); }
  });
  return out;
}
function highlight(id) {
  const keep = new Set([id]);
  G.edges.forEach(e => { if (e.source === id) keep.add(e.target); if (e.target === id) keep.add(e.source); });
  const dim = css("--dim");
  nodes.update(G.nodes.map(n => keep.has(n.id) ? { id: n.id, color: nodeStyle(n).color, font: nodeStyle(n).font, label: n.label }
    : { id: n.id, color: { background: dim, border: dim }, font: { color: "rgba(0,0,0,0)", strokeWidth: 0 } }));
}
function clearHighlight() { selected = null; nodes.update(G.nodes.map(nodeStyle)); renderEmpty(); }
function focusNode(id) {
  const n = byId.get(id); if (!n) return;
  if (!visible.has(n.type)) { visible.add(n.type); typesEl.querySelector(`[data-t="${n.type}"]`)?.setAttribute("aria-pressed", true); applyFilter(); }
  selected = id; highlight(id); renderNode(n);
  net.selectNodes([id]); net.focus(id, { scale: 1.1, animation: { duration: 450 } });
}
net.on("click", p => p.nodes.length ? focusNode(p.nodes[0]) : clearHighlight());
document.getElementById("q").addEventListener("change", e => {
  const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const n = G.nodes.find(n => n.label.toLowerCase() === v) || G.nodes.find(n => n.label.toLowerCase().includes(v));
  if (n) focusNode(n.id);
});

const insp = document.getElementById("inspector");
const PROP_ORDER = ["title", "kind", "status", "category", "role", "ecosystem", "commits", "files", "first_commit", "last_commit", "used_by_projects", "technology", "url"];
const PROP_LABEL = { title: "Title", kind: "Kind", status: "Status", category: "Category", role: "Role", ecosystem: "Ecosystem", commits: "Commits",
  files: "Files", first_commit: "First commit", last_commit: "Last commit", used_by_projects: "Used by", technology: "Technology", url: "Repo" };
function renderNode(n) {
  const key = (TYPES.find(t => t[0] === n.type) || [, "library"])[1];
  let h = `<span class="kind"><i style="background:var(--c-${key})"></i>${esc(n.type)}</span><h2>${esc(n.label)}</h2>`;
  if (n.props.description) h += `<p class="desc">${esc(n.props.description)}</p>`;
  h += "<dl>";
  PROP_ORDER.forEach(k => { const v = n.props[k]; if (v === undefined || v === "" || (k === "title" && v === n.label)) return;
    let val = esc(Array.isArray(v) ? v.join(", ") : v);
    if (k === "url") val = `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace("https://github.com/", ""))}</a>`;
    if (k === "used_by_projects") val += " projects";
    h += `<dt>${PROP_LABEL[k]}</dt><dd>${val}</dd>`; });
  if (n.type === "Project" && PAGES_BASE && !single) h += `<dt>Graph</dt><dd><a href="${PAGES_BASE}${encodeURIComponent(n.label)}/index.html">Open project graph</a></dd>`;
  h += "</dl>";
  const groups = [...neighbours(n.id)].sort((a, b) => b[1].length - a[1].length);
  groups.forEach(([k, list]) => {
    const dir = k[0], type = k.slice(1);
    const label = dir === "→" ? (REL_LABEL[type] || type) : (INV_LABEL[type] || type);
    list.sort((a, b) => (degree.get(b[0]) || 0) - (degree.get(a[0]) || 0));
    h += `<div class="rel"><h3><span>${esc(label)}</span><span>${list.length}</span></h3><div class="chips">` +
      list.map(([id, e]) => { const m = byId.get(id); if (!m) return "";
        const mk = (TYPES.find(t => t[0] === m.type) || [, "library"])[1];
        let extra = e.props?.identical_files ? ` · ${e.props.identical_files} files` : e.props?.score ? ` · ${Math.round(e.props.score * 100)}%` : e.props?.commits ? ` · ${e.props.commits}` : "";
        const tip = e.props?.shared ? "Shared: " + e.props.shared.join(", ") : e.props?.examples ? "e.g. " + e.props.examples.join(", ") : "";
        return `<button class="chip" type="button" data-id="${esc(id)}" title="${esc(tip)}"><i style="background:var(--c-${mk})"></i><span>${esc(m.label)}${extra}</span></button>`; }).join("") +
      `</div></div>`;
  });
  insp.innerHTML = h;
  insp.querySelectorAll(".chip").forEach(b => b.onclick = () => focusNode(b.dataset.id));
  insp.scrollTop = 0;
}
function renderEmpty() {
  const reuse = G.edges.filter(e => e.type === "SHARES_CODE_WITH" || e.type === "EVOLVED_INTO");
  const topTech = G.nodes.filter(n => n.type === "Technology").map(n => [n, G.edges.filter(e => e.target === n.id && e.type === "USES" && e.source.startsWith("project:")).length])
    .sort((a, b) => b[1] - a[1]).slice(0, 10);
  let h = `<p class="label">Overview</p><div class="empty"><p>Select any node to see what it connects to. Projects link to their stack, the services they call, what they are about and who built them.</p></div>`;
  if (single) { const p = projects[0]; renderNode(p); selected = null; return; }
  h += `<div class="rel"><h3><span>Most used technologies</span><span>projects</span></h3><div class="chips">` +
    topTech.map(([n, c]) => `<button class="chip" type="button" data-id="${esc(n.id)}"><i style="background:var(--c-tech)"></i><span>${esc(n.label)} · ${c}</span></button>`).join("") + `</div></div>`;
  if (reuse.length) h += `<div class="rel"><h3><span>Code reuse</span><span>${reuse.length}</span></h3><div class="chips">` +
    reuse.map(e => `<button class="chip" type="button" data-id="${esc(e.source)}"><i style="background:var(--c-project)"></i><span>${esc(byId.get(e.source).label)} → ${esc(byId.get(e.target).label)}</span></button>`).join("") + `</div></div>`;
  insp.innerHTML = h;
  insp.querySelectorAll(".chip").forEach(b => b.onclick = () => focusNode(b.dataset.id));
}
renderEmpty();
</script>
