.status.active { background: color-mix(in srgb, var(--c-platform) 22%, transparent); color: var(--ink) }

.btn:hover { border-color: var(--accent) }

.kind i { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
.desc { margin: 8px 0 14px; max-width: 60ch }

dt { color: var(--muted); font: 12px var(--f-mono) }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums }

.rel { margin: 0 0 14px }
.rel h3 { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between }

.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip:hover { border-color: var(--accent) }
.empty { color: var(--muted); font-size: 14px }
.empty p { margin: 0 0 10px; max-width: 40ch }

@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

  if (single) { const p = projects[0]; renderNode(p); selected = null; return; }
  h += `<div class="rel"><h3><span>Most used technologies</span><span>projects</span></h3><div class="chips">` +
    topTech.map(([n, c]) => `<button class="chip" type="button" data-id="${esc(n.id)}"><i style="background:var(--c-tech)"></i><span>${esc(n.label)} · ${c}</span></button>`).join("") + `</div></div>`;
  if (reuse.length) h += `<div class="rel"><h3><span>Code reuse</span><span>${reuse.length}</span></h3><div class="chips">` +
    reuse.map(e => `<button class="chip" type="button" data-id="${esc(e.source)}"><i style="background:var(--c-project)"></i><span>${esc(byId.get(e.source).label)} → ${esc(byId.get(e.target).label)}</span></button>`).join("") + `</div></div>`;
  insp.innerHTML = h;
  insp.querySelectorAll(".chip").forEach(b => b.onclick = () => focusNode(b.dataset.id));
}
renderEmpty();
</script>
