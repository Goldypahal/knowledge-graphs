name: Build project knowledge graph

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "17 3 * * 1"      # every Monday 03:17 UTC (08:47 IST)
  push:
    branches: [main]
    paths: [repos.txt, project_notes.yml, "scripts/**", ".github/workflows/build-graph.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-graph
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml neo4j

      - name: Clone repos and build graphs
        # For private repos, add a PAT with repo read access as secret REPOS_TOKEN.
        env:
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
        run: |
          if [ -n "$REPOS_TOKEN" ]; then
            git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          python scripts/build_graph.py --clone --repos-dir _repos --out graphs

      - name: Commit updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update project knowledge graph"
            git push
          fi

      - name: Load into Neo4j
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          if [ -z "$NEO4J_URI" ]; then
            echo "::notice::NEO4J_URI secret not set, skipping Neo4j load. See README."
          else
            python scripts/load_neo4j.py --replace
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: graphs

  pages:
    # GitHub Pages is free for public repos only; skipped while the repo is private
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
